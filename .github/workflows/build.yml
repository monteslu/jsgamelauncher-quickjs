name: build

on:
  push:
    branches: [main]
    # Tags must trigger the workflow too, or the release job can never run: it is
    # gated on refs/tags/v* but would never be reached.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # The same six targets native-gles itself builds and ships. Linux uses the
    # system EGL; macOS and Windows get ANGLE, downloaded by native-gles's own
    # script so both projects use identical binaries.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64,     os: ubuntu-22.04,     platform: linux  }
          - { name: linux-arm64,   os: ubuntu-22.04-arm, platform: linux  }
          - { name: macos-arm64,   os: macos-15,         platform: darwin }
          - { name: macos-x64,     os: macos-15-intel,   platform: darwin }
          - { name: windows-x64,   os: windows-2022,     platform: win32  }
          - { name: windows-arm64, os: windows-11-arm,   platform: win32  }

    # CMake expects native-gles and webaudio-node as SIBLINGS (../native-gles), which
    # is how they sit in a normal dev checkout. actions/checkout refuses to write
    # outside the workspace, so the launcher goes in a subdirectory and the siblings
    # go beside it, reproducing that layout exactly.
    defaults:
      run:
        working-directory: jsgamelauncher-quickjs

    steps:
      - uses: actions/checkout@v4
        with:
          path: jsgamelauncher-quickjs

      # Both are consumed as SOURCE and compiled here with zero edits.
      - name: checkout native-gles
        uses: actions/checkout@v4
        with:
          repository: monteslu/native-gles
          path: native-gles
      - name: checkout webaudio-node
        uses: actions/checkout@v4
        with:
          repository: monteslu/webaudio-node
          path: webaudio-node

      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      # Linux: system EGL/GLES plus the software rasterizer, since CI runners have
      # no GPU and the smoke test renders for real rather than trusting exit codes.
      - name: deps (linux)
        if: matrix.platform == 'linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libsdl2-dev libegl-dev \
                                  libgles-dev libgl1-mesa-dri xvfb

      - name: deps (macos)
        if: matrix.platform == 'darwin'
        working-directory: .
        run: brew install cmake ninja sdl2

      - name: deps (windows)
        if: matrix.platform == 'win32'
        working-directory: .
        shell: pwsh
        run: |
          # Match the runner's own architecture: an arm64 runner cannot use x64
          # SDL2 binaries.
          $triplet = if ("${{ matrix.name }}" -eq "windows-arm64") { "arm64-windows" } else { "x64-windows" }
          vcpkg install "sdl2:$triplet"
          # CMake finds vcpkg packages ONLY through its toolchain file; installing
          # alone is not enough and fails at find_package.
          echo "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" >> $env:GITHUB_ENV
          echo "VCPKG_TARGET_TRIPLET=$triplet" >> $env:GITHUB_ENV

      # macOS and Windows have no system GLES. native-gles ships ANGLE for exactly
      # this, so use ITS downloader rather than a second, divergent copy here.
      - name: download ANGLE
        if: matrix.platform != 'linux'
        working-directory: native-gles
        run: |
          npm install --ignore-scripts
          npm run download-angle

      - name: fetch quickjs
        run: node scripts/fetch-deps.mjs

      - name: build
        shell: bash
        run: |
          EXTRA=""
          if [ -n "${CMAKE_TOOLCHAIN_FILE:-}" ]; then
            EXTRA="-DCMAKE_TOOLCHAIN_FILE=$CMAKE_TOOLCHAIN_FILE -DVCPKG_TARGET_TRIPLET=$VCPKG_TARGET_TRIPLET"
          fi
          cmake -S . -B build-cmake -DCMAKE_BUILD_TYPE=Release $EXTRA
          cmake --build build-cmake --config Release -j

      # A build that produces a binary which cannot boot is not a passing build.
      # This runs a real game headless and requires actual drawn pixels, because a
      # blank frame is a failure that a zero exit code will happily report as success.
      # A build that produces a binary which cannot boot is not a passing build.
      # This runs a real game headless and requires actual drawn pixels: a blank
      # frame is a failure that exit code 0 would happily report as success.
      - name: smoke test (linux)
        if: matrix.platform == 'linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          EGL_PLATFORM: surfaceless
        run: xvfb-run -a node test/smoke.mjs

      # macOS and Windows runners have no display, and ANGLE needs one for a real
      # context. The binary is still verified to load and report itself, which
      # catches a broken link or a missing ANGLE dylib.
      - name: smoke test (macos/windows)
        if: matrix.platform != 'linux'
        shell: bash
        run: |
          set -eu
          EXE=jsglq; [ "${{ matrix.platform }}" = "windows" ] && EXE=jsglq.exe
          # Multi-config generators may still place it under a config subdir.
          BIN=""
          for c in "build/$EXE" "build/Release/$EXE"; do
            [ -f "$c" ] && BIN="$c" && break
          done
          if [ -z "$BIN" ]; then
            echo "no binary found; build/ contains:"; ls -R build | head -40; exit 1
          fi
          echo "running $BIN --version"
          "./$BIN" --version

      - name: size budget
        shell: bash
        run: node scripts/size-budget.mjs

      - name: package
        shell: bash
        run: |
          set -eu
          OUT="jsglq-${{ matrix.name }}"
          mkdir -p "dist/$OUT"
          cp build/jsglq* "dist/$OUT/" 2>/dev/null || cp build/Release/jsglq* "dist/$OUT/"
          # ANGLE travels with the binary on macOS/Windows: without libEGL/libGLESv2
          # beside it the launcher cannot create a GL context at all. The downloader
          # puts BOTH dylibs and DLLs in angle/lib (not angle/bin), and a missing
          # copy here ships an archive that cannot render, so this asserts rather
          # than falling through to a silent `|| true`.
          if [ "${{ matrix.platform }}" != "linux" ]; then
            ANGLE=../native-gles/angle/lib
            n=0
            for f in "$ANGLE"/*.dylib "$ANGLE"/*.dll; do
              [ -f "$f" ] || continue
              cp "$f" "dist/$OUT/"; n=$((n+1))
            done
            if [ "$n" -eq 0 ]; then
              echo "no ANGLE runtime libraries found in $ANGLE"; ls -la "$ANGLE" || true; exit 1
            fi
            echo "bundled $n ANGLE libraries"
          fi
          cp -r runtime "dist/$OUT/runtime"
          cp -r examples "dist/$OUT/examples"
          cp README.md LICENSE THIRD-PARTY.md "dist/$OUT/"
          # A downloaded binary should be runnable without reading anything first.
          cat > "dist/$OUT/RUN-ME.txt" <<'TXT'
          jsgamelauncher-quickjs

          Try an example:
              ./jsglq examples/hello-canvas
              ./jsglq examples/hello-3d

          Run your own game:
              ./jsglq /path/to/your-game

          Ship your game as ONE file:
              node scripts/fuse.mjs /path/to/your-game my-game

          Options:      ./jsglq --help
          Licensing:    ./jsglq --licenses   (commercial use is fine; see THIRD-PARTY.md)
          TXT
          echo "packaged $OUT"

      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: jsglq-${{ matrix.name }}
          path: jsgamelauncher-quickjs/dist/jsglq-${{ matrix.name }}

  release:
    name: publish release binaries
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: archive each platform
        run: |
          set -eu
          cd artifacts
          for d in */; do
            name="${d%/}"
            chmod +x "$name"/jsglq 2>/dev/null || true
            tar czf "../$name.tar.gz" "$name"
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: "*.tar.gz"
          generate_release_notes: true

  test:
    name: regression + harness self-test
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: jsgamelauncher-quickjs

    steps:
      - uses: actions/checkout@v4
        with: { path: jsgamelauncher-quickjs }
      - uses: actions/checkout@v4
        with: { repository: monteslu/native-gles, path: native-gles }
      - uses: actions/checkout@v4
        with: { repository: monteslu/webaudio-node, path: webaudio-node }
      - run: |
          sudo apt-get update
          sudo apt-get install -y cmake libsdl2-dev libegl-dev libgles-dev xvfb
      - run: node scripts/fetch-deps.mjs
      - run: cmake -S . -B build-cmake -DCMAKE_BUILD_TYPE=Release && cmake --build build-cmake -j
      # The must-fail controls run here too: if one ever passes, the harness is
      # broken and every number it has produced is void.
      - run: xvfb-run -a node test/regression/run.mjs
