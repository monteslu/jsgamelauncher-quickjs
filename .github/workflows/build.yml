name: build

on:
  push:
    branches: [main]
    # Tags must trigger the workflow too, or the release job can never run: it is
    # gated on refs/tags/v* but would never be reached.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # The same six targets native-gles itself builds and ships. Linux uses the
    # system EGL; macOS and Windows get ANGLE, downloaded by native-gles's own
    # script so both projects use identical binaries.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64,     os: ubuntu-22.04,     platform: linux  }
          - { name: linux-arm64,   os: ubuntu-22.04-arm, platform: linux  }
          - { name: macos-arm64,   os: macos-15,         platform: darwin }
          - { name: macos-x64,     os: macos-15-intel,   platform: darwin }
          - { name: windows-x64,   os: windows-2022,     platform: win32  }
          - { name: windows-arm64, os: windows-11-arm,   platform: win32  }

    # CMake expects native-gles and webaudio-node as SIBLINGS (../native-gles), which
    # is how they sit in a normal dev checkout. actions/checkout refuses to write
    # outside the workspace, so the launcher goes in a subdirectory and the siblings
    # go beside it, reproducing that layout exactly.
    defaults:
      run:
        working-directory: jsgamelauncher-quickjs

    steps:
      - uses: actions/checkout@v4
        with:
          path: jsgamelauncher-quickjs

      # Both are consumed as SOURCE and compiled here with zero edits.
      - name: checkout native-gles
        uses: actions/checkout@v4
        with:
          repository: monteslu/native-gles
          path: native-gles
      - name: checkout webaudio-node
        uses: actions/checkout@v4
        with:
          repository: monteslu/webaudio-node
          path: webaudio-node

      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      # Linux: system EGL/GLES plus the software rasterizer, since CI runners have
      # no GPU and the smoke test renders for real rather than trusting exit codes.
      - name: deps (linux)
        if: matrix.platform == 'linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libsdl2-dev libegl-dev \
                                  libgles-dev libgl1-mesa-dri xvfb

      - name: deps (macos)
        if: matrix.platform == 'darwin'
        working-directory: .
        run: brew install cmake ninja sdl2

      - name: deps (windows)
        if: matrix.platform == 'win32'
        working-directory: .
        shell: pwsh
        run: |
          # Match the runner's own architecture: an arm64 runner cannot use x64
          # SDL2 binaries.
          $triplet = if ("${{ matrix.name }}" -eq "windows-arm64") { "arm64-windows" } else { "x64-windows" }
          vcpkg install "sdl2:$triplet"
          # CMake finds vcpkg packages ONLY through its toolchain file; installing
          # alone is not enough and fails at find_package.
          echo "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" >> $env:GITHUB_ENV
          echo "VCPKG_TARGET_TRIPLET=$triplet" >> $env:GITHUB_ENV

      # macOS and Windows have no system GLES. native-gles ships ANGLE for exactly
      # this, so use ITS downloader rather than a second, divergent copy here.
      - name: download ANGLE
        if: matrix.platform != 'linux'
        working-directory: native-gles
        run: |
          npm install --ignore-scripts
          npm run download-angle

      - name: fetch quickjs
        run: node scripts/fetch-deps.mjs

      - name: build
        shell: bash
        run: |
          EXTRA=""
          if [ -n "${CMAKE_TOOLCHAIN_FILE:-}" ]; then
            EXTRA="-DCMAKE_TOOLCHAIN_FILE=$CMAKE_TOOLCHAIN_FILE -DVCPKG_TARGET_TRIPLET=$VCPKG_TARGET_TRIPLET"
          fi
          cmake -S . -B build-cmake -DCMAKE_BUILD_TYPE=Release $EXTRA
          cmake --build build-cmake --config Release -j

      # macOS links SDL2 by the ABSOLUTE path Homebrew bakes into it, so the
      # binary only runs on a machine with Homebrew's SDL2 at that exact path.
      # This copies every non-system dependency beside the binary, rewrites the
      # references to @rpath, and strips rpaths that point at the build machine.
      - name: bundle macOS libraries
        if: matrix.platform == 'darwin'
        shell: bash
        run: node scripts/bundle-macos-libs.mjs build/jsglq

      # A build that produces a binary which cannot boot is not a passing build.
      # This runs a real game headless and requires actual drawn pixels, because a
      # blank frame is a failure that a zero exit code will happily report as success.
      # A build that produces a binary which cannot boot is not a passing build.
      # This runs a real game headless and requires actual drawn pixels: a blank
      # frame is a failure that exit code 0 would happily report as success.
      - name: smoke test (linux)
        if: matrix.platform == 'linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          EGL_PLATFORM: surfaceless
        run: xvfb-run -a node test/smoke.mjs

      # There is deliberately NO build-tree smoke test for macOS/Windows.
      #
      # It used to run `build/jsglq --version` here, and that check is what let a
      # broken macOS 0.1.0 ship: inside the build tree Homebrew's SDL2 is present,
      # so the binary runs there whether or not the ARCHIVE can run anywhere else.
      # The real check is "verify the packaged artifact" below, which runs the
      # thing users actually download. A weaker duplicate that passes when the
      # strong one would fail is worse than no check at all.

      - name: size budget
        shell: bash
        run: node scripts/size-budget.mjs

      - name: package
        shell: bash
        run: |
          set -eu
          OUT="jsglq-${{ matrix.name }}"
          mkdir -p "dist/$OUT"
          # Copy the binary by name, from whichever layout the generator produced.
          # A glob with a `||` fallback can half-succeed and package nothing.
          BIN=""
          for c in build/jsglq.exe build/Release/jsglq.exe build/jsglq build/Release/jsglq; do
            if [ -f "$c" ]; then BIN="$c"; break; fi
          done
          if [ -z "$BIN" ]; then echo "no binary to package"; ls -R build | head -40; exit 1; fi
          cp "$BIN" "dist/$OUT/"
          # ANGLE travels with the binary on macOS/Windows: without libEGL/libGLESv2
          # beside it the launcher cannot create a GL context at all. The downloader
          # puts BOTH dylibs and DLLs in angle/lib (not angle/bin), and a missing
          # copy here ships an archive that cannot render, so this asserts rather
          # than falling through to a silent `|| true`.
          if [ "${{ matrix.platform }}" != "linux" ]; then
            n=0
            # Take the libraries from build/ on BOTH platforms, because build/ is
            # where the binary was linked and tested against them: Windows gets
            # its DLLs there from a CMake POST_BUILD copy, macOS gets its dylibs
            # there from bundle-macos-libs.mjs (which also rewrites the install
            # names). Copying macOS dylibs from the ANGLE download instead would
            # miss libSDL2 entirely — that is precisely how 0.1.0 shipped a macOS
            # archive that could not start.
            for f in build/*.dll build/*.dylib; do
              [ -f "$f" ] || continue
              cp "$f" "dist/$OUT/"; n=$((n+1))
            done
            if [ "$n" -eq 0 ]; then
              echo "no GL runtime libraries found to bundle"
              ls -la build || true
              exit 1
            fi
            echo "bundled $n runtime libraries"
          fi
          cp -r runtime "dist/$OUT/runtime"
          cp -r examples "dist/$OUT/examples"
          cp README.md LICENSE THIRD-PARTY.md "dist/$OUT/"
          # A downloaded binary should be runnable without reading anything first.
          cat > "dist/$OUT/RUN-ME.txt" <<'TXT'
          jsgamelauncher-quickjs

          Try an example:
              ./jsglq examples/hello-canvas
              ./jsglq examples/hello-3d

          Run your own game:
              ./jsglq /path/to/your-game

          Ship your game as ONE file:
              node scripts/fuse.mjs /path/to/your-game my-game

          Options:      ./jsglq --help
          Licensing:    ./jsglq --licenses   (commercial use is fine; see THIRD-PARTY.md)
          TXT
          echo "packaged $OUT"

      # THE test that matters: run the PACKAGED artifact, from a directory that
      # is not the build tree, and make it open a real GL context.
      #
      # 0.1.0 shipped a macOS archive that died in the dynamic loader on every
      # machine except the build runner. CI was green because the smoke test ran
      # the binary INSIDE the build tree (where Homebrew's SDL2 exists) and only
      # asked it to print --version (which returns before any library is used).
      # Testing the build tree says nothing about what got packaged.
      - name: verify the packaged artifact
        shell: bash
        timeout-minutes: 5
        run: |
          set -eu
          OUT="jsglq-${{ matrix.name }}"
          cd "dist/$OUT"
          EXE=./jsglq; [ -f ./jsglq.exe ] && EXE=./jsglq.exe || true
          "$EXE" --version

          # --check opens a real headless GL context. Linux runners have no GPU,
          # so point it at the software rasterizer; macOS/Windows runners have no
          # display at all, where ANGLE cannot make a context — there, prove
          # self-containment by inspecting the binary instead of running it.
          if [ "${{ matrix.platform }}" = "linux" ]; then
            LIBGL_ALWAYS_SOFTWARE=1 EGL_PLATFORM=surfaceless xvfb-run -a "$EXE" --check
          elif [ "${{ matrix.platform }}" = "darwin" ]; then
            # Every non-system dependency must be @rpath-relative, and no rpath
            # may point outside the bundle. An absolute /opt/homebrew path here
            # is exactly the 0.1.0 defect.
            otool -L jsglq | tail -n +2 | awk '{print $1}' > /tmp/deps.txt
            if grep -vE '^(/usr/lib/|/System/|@rpath/|@loader_path/|@executable_path/)' /tmp/deps.txt; then
              echo "FAIL: the above dependencies are absolute paths off this machine"
              exit 1
            fi
            otool -l jsglq | awk '/LC_RPATH/{f=1} f&&/path /{print $2; f=0}' > /tmp/rpaths.txt
            if grep -vE '^@(loader_path|executable_path)' /tmp/rpaths.txt; then
              echo "FAIL: the above rpaths point outside the bundle"
              exit 1
            fi
            echo "macOS bundle is self-contained"
          fi

      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: jsglq-${{ matrix.name }}
          path: jsgamelauncher-quickjs/dist/jsglq-${{ matrix.name }}

  release:
    name: publish release binaries
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: archive each platform
        run: |
          set -eu
          cd artifacts
          for d in */; do
            name="${d%/}"
            # Windows gets a .zip (what the platform expects and can open with no
            # extra tooling); everyone else gets a .tar.gz, which preserves the
            # executable bit that a zip would drop.
            case "$name" in
              *windows*) zip -qr "../$name.zip" "$name" ;;
              *) chmod +x "$name"/jsglq; tar czf "../$name.tar.gz" "$name" ;;
            esac
          done
          ls -la ../*.tar.gz ../*.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            *.zip
          generate_release_notes: true

  test:
    name: regression + harness self-test
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: jsgamelauncher-quickjs

    steps:
      - uses: actions/checkout@v4
        with: { path: jsgamelauncher-quickjs }
      - uses: actions/checkout@v4
        with: { repository: monteslu/native-gles, path: native-gles }
      - uses: actions/checkout@v4
        with: { repository: monteslu/webaudio-node, path: webaudio-node }
      - run: |
          sudo apt-get update
          sudo apt-get install -y cmake libsdl2-dev libegl-dev libgles-dev xvfb
      - run: node scripts/fetch-deps.mjs
      - run: cmake -S . -B build-cmake -DCMAKE_BUILD_TYPE=Release && cmake --build build-cmake -j
      # The must-fail controls run here too: if one ever passes, the harness is
      # broken and every number it has produced is void.
      - run: xvfb-run -a node test/regression/run.mjs
